<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIN5 買い目生成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: #0f1923;
      color: #e8e8e8;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a2a4a, #0d3b6e);
      padding: 14px 16px;
      border-bottom: 2px solid #2a5298;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1.3rem; color: #ffd700; letter-spacing: 0.05em; }
    header p { font-size: 0.75rem; color: #8ba3c0; margin-top: 2px; }

    .container { max-width: 960px; margin: 0 auto; padding: 16px 12px; }

    /* ─── フォーム ─── */
    .form-card {
      background: #1a2535;
      border: 1px solid #2a3d55;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .form-card h2 { font-size: 0.9rem; color: #8ba3c0; margin-bottom: 12px; }
    .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.75rem; color: #8ba3c0; }
    .form-group input {
      background: #0f1923;
      border: 1px solid #2a3d55;
      border-radius: 8px;
      color: #e8e8e8;
      padding: 10px 12px;
      font-size: 1rem;
      width: 150px;
    }
    .form-group input:focus { outline: none; border-color: #ffd700; }
    .btn {
      border: none; border-radius: 8px; padding: 11px 16px;
      font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-check { background: #2a5298; color: #fff; }
    .btn-generate { background: linear-gradient(135deg, #f0a500, #ffd700); color: #0f1923; }

    .budget-presets { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .preset-btn {
      background: #1a2535; border: 1px solid #2a5298; border-radius: 6px;
      color: #8ba3c0; padding: 6px 12px; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
      flex: 1; min-width: 60px; text-align: center;
    }
    .preset-btn:hover, .preset-btn.active { background: #2a3d55; border-color: #ffd700; color: #ffd700; }

    /* ─── ステータス ─── */
    .status-bar {
      border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
      font-size: 0.85rem; display: none;
    }
    .status-bar.loading { background:#1a2535; border:1px solid #2a5298; color:#8ba3c0; }
    .status-bar.error   { background:#1a0a0a; border:1px solid #c0392b; color:#e74c3c; }
    .status-bar.ok      { background:#0a1a0a; border:1px solid #27ae60; color:#2ecc71; }

    /* ─── 週判定バナー ─── */
    .verdict-card {
      border-radius: 12px; padding: 16px; margin-bottom: 14px; display: none;
    }
    .verdict-card.buy  { background:#0a2a0a; border:2px solid #27ae60; }
    .verdict-card.skip { background:#2a0a0a; border:2px solid #c0392b; }
    .verdict-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 6px; }
    .verdict-card.buy  .verdict-title { color: #2ecc71; }
    .verdict-card.skip .verdict-title { color: #e74c3c; }
    .verdict-detail { font-size: 0.8rem; color: #a0b0c0; margin-bottom: 10px; }
    .verdict-races { display: flex; gap: 6px; flex-wrap: wrap; }
    .verdict-race {
      background: #0f1923; border: 1px solid #2a3d55; border-radius: 6px;
      padding: 5px 10px; font-size: 0.75rem; flex: 1; min-width: 140px;
    }
    .verdict-race .rname { color: #c0d0e0; }
    .verdict-race .rinfo { color: #8ba3c0; font-size: 0.7rem; margin-top: 2px; }
    .verdict-race.heavy { border-color: #c0392b; }
    .skip-reasons { margin-top: 8px; }
    .skip-reason {
      background: #3a0a0a; border-left: 3px solid #e74c3c;
      padding: 6px 10px; font-size: 0.8rem; color: #e74c3c; margin-top: 6px; border-radius: 0 4px 4px 0;
    }

    /* ─── サマリー ─── */
    .summary-bar {
      background: linear-gradient(135deg, #0d3b6e, #1a2a4a);
      border: 1px solid #2a5298; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 16px;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .summary-item { display: flex; flex-direction: column; gap: 2px; }
    .summary-item .label { font-size: 0.7rem; color: #8ba3c0; }
    .summary-item .value { font-size: 1.2rem; font-weight: bold; color: #ffd700; }

    /* ─── チケット ─── */
    .ticket { background:#1a2535; border:1px solid #2a3d55; border-radius:12px; margin-bottom:12px; overflow:hidden; }
    .ticket-header {
      background: #0d3b6e; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .ticket-header .ticket-no { font-size: 0.8rem; color: #8ba3c0; }
    .ticket-header .ticket-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .ticket-header .combos { color: #ffd700; font-weight: bold; font-size: 0.9rem; }
    .range-badge {
      background:#1a4a1a; border:1px solid #27ae60; border-radius:4px;
      padding:2px 6px; font-size:0.72rem; color:#2ecc71;
    }

    /* スマホではテーブルを縦積みに */
    table.slot-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    table.slot-table th {
      background:#141e2e; color:#8ba3c0; padding:6px 10px; text-align:left;
      font-weight:normal; font-size:0.72rem; border-bottom:1px solid #2a3d55;
    }
    table.slot-table td { padding:8px 10px; border-bottom:1px solid #1e2d42; vertical-align:middle; }
    table.slot-table tr:last-child td { border-bottom:none; }
    .slot-num { color:#8ba3c0; font-size:0.78rem; white-space:nowrap; }
    .race-name { color:#c0d0e0; font-size:0.78rem; }
    .pop-range { color:#8ba3c0; font-size:0.75rem; white-space:nowrap; }

    /* スマホでは詳細テーブルを隠してコンパクト優先 */
    @media (max-width: 600px) {
      table.slot-table th:nth-child(3),
      table.slot-table td:nth-child(3) { display: none; }
      .ticket-header .ticket-info { gap: 8px; }
    }

    .ipat-row { background:#0f1923; border-top:1px solid #2a3d55; padding:10px 14px; }
    .ipat-row .ipat-label { font-size:0.72rem; color:#8ba3c0; margin-bottom:6px; }
    .ipat-grid { display:flex; gap:6px; flex-wrap:wrap; }
    .ipat-slot {
      background:#1a2535; border:1px solid #2a5298; border-radius:6px;
      padding:5px 10px; font-size:0.82rem; font-family:monospace; color:#e8e8e8;
    }
    .ipat-slot span { color:#8ba3c0; font-size:0.72rem; margin-right:3px; }

    .zone-note {
      background:#0f2a1a; border:1px solid #27ae60; border-radius:8px;
      padding:8px 14px; font-size:0.78rem; color:#2ecc71; margin-bottom:14px;
    }
    .zone-note strong { color:#ffd700; }

    #result { display:none; }
    .races-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .race-chip {
      background:#1a2535; border:1px solid #2a3d55; border-radius:6px;
      padding:5px 10px; font-size:0.75rem; color:#8ba3c0;
    }
    .race-chip span { color:#ffd700; font-weight:bold; margin-right:3px; }

    /* ─── コンパクト表示（スマホ最重要） ─── */
    #compact-ipat {
      background: #0f1923;
      border: 2px solid #ffd700;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    #compact-ipat .ipat-title {
      font-size: 0.75rem; color: #8ba3c0; margin-bottom: 12px; letter-spacing:.05em;
    }
    .ipat-race-row {
      display: flex; align-items: baseline; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid #1e3050;
    }
    .ipat-race-label {
      min-width: 36px; font-size: 0.72rem; color: #8ba3c0; flex-shrink: 0;
    }
    .ipat-race-nums {
      font-size: 1.3rem; font-weight: bold; color: #ffd700; letter-spacing: .08em;
    }
    .ipat-ticket-row {
      padding: 7px 0; border-bottom: 1px solid #1a2a3a;
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    }
    .ipat-ticket-label {
      color: #ffd700; font-weight: bold; font-size: 0.85rem; min-width: 28px;
    }
    .ipat-ticket-slot { margin-right: 8px; white-space: nowrap; font-size: 0.85rem; }
    .ipat-ticket-slot-r { color: #6a88aa; font-size: 0.72rem; }
    .ipat-ticket-combos { color: #4a6a8a; font-size: 0.75rem; margin-left: auto; }
  </style>
</head>
<body>
  <header>
    <h1>🏇 WIN5 買い目生成</h1>
    <p>ターゲットゾーン（人気の和 15〜22）を広範囲カバー / 低ゾーン 0 通り保証</p>
  </header>

  <div class="container">
    <!-- 入力フォーム -->
    <div class="form-card">
      <h2>購入条件を設定</h2>
      <div class="form-row">
        <div class="form-group">
          <label>日付（空欄で最新WIN5）</label>
          <input type="text" id="date-input" placeholder="例: 20260614" maxlength="8">
        </div>
        <div class="form-group">
          <label>予算</label>
          <input type="number" id="budget-input" value="50000" step="1000" min="1000">
        </div>
        <!-- 通常ボタン群（2列グリッド） -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px;">
          <button class="btn btn-check" id="check-btn" onclick="checkWeek()" style="width:100%;">① 今週の判定</button>
          <button class="btn" id="snap-btn" onclick="saveSnapshot()" style="width:100%;background:#1a3550;border:1px solid #2a5298;color:#8ba3c0;">📸 オッズ記録</button>
          <button class="btn" id="move-btn" onclick="loadMovement()" style="width:100%;background:#2a1a40;border:1px solid #5a2a8a;color:#b88ae0;">📊 変動を見る</button>
          <button class="btn" id="select-btn" onclick="loadHorses()" style="width:100%;background:#1a3a5a;border:1px solid #2a5298;color:#8ba3c0;">② 馬を選択</button>
          <button class="btn btn-generate" id="gen-btn" onclick="generate()" style="width:100%;grid-column:span 2;">③ 買い目を生成</button>
        </div>
      </div>
      <!-- 締切直前ワンボタン -->
      <div style="margin-top:10px;">
        <button id="quick-btn" onclick="quickGenerate()" style="width:100%;padding:16px;background:linear-gradient(135deg,#7b2d00,#c0392b);border:2px solid #e74c3c;border-radius:10px;color:#fff;font-size:1.1rem;font-weight:bold;cursor:pointer;letter-spacing:.05em;">
          🚀 締切前ワンボタン
        </button>
        <div style="font-size:0.72rem;color:#6a88aa;text-align:center;margin-top:4px;">14:30〜35頃に押す — 記録 → 急落確認 → 買い目生成 を一発で</div>
      </div>
      <!-- データ推奨フィルター -->
      <div style="margin-top:10px;background:#0f2a1a;border:1px solid #27ae60;border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div>
          <span style="font-size:0.85rem;color:#2ecc71;font-weight:bold;">📊 データ推奨フィルター</span>
          <div style="font-size:0.72rem;color:#6a88aa;margin-top:2px;">328回実績: R1・R2・R5→1〜4人気 / R3・R4→1〜5人気 で約70%カバー</div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="auto-filter" style="width:18px;height:18px;cursor:pointer;">
          <span style="font-size:0.9rem;color:#2ecc71;font-weight:bold;">適用する</span>
        </label>
      </div>
      <div class="budget-presets">
        <span style="font-size:0.75rem;color:#8ba3c0;align-self:center;">予算:</span>
        <button class="preset-btn" onclick="setPreset(30000)">3万円</button>
        <button class="preset-btn active" onclick="setPreset(50000)">5万円</button>
        <button class="preset-btn" onclick="setPreset(80000)">8万円</button>
        <button class="preset-btn" onclick="setPreset(100000)">10万円</button>
      </div>
    </div>

    <!-- オッズ変動パネル -->
    <div id="movement-panel" style="display:none;background:#1a1a2e;border:1px solid #5a2a8a;border-radius:12px;padding:20px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <span style="font-size:0.9rem;color:#b88ae0;font-weight:bold;">📊 オッズ変動モニター</span>
        <span style="font-size:0.72rem;color:#6a88aa;">🔴 急落 = 大口購入シグナル（オッズ30%↓ or 人気3つ↑）</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <button onclick="reSnap()" id="resnap-btn" style="background:#1a3550;border:1px solid #2a5298;color:#8ba3c0;padding:7px 16px;border-radius:8px;font-size:0.85rem;cursor:pointer;font-weight:bold;">
          📸 再スナップ
        </button>
        <button onclick="reSnapAndGenerate()" id="resnap-gen-btn" style="background:linear-gradient(135deg,#1a3a1a,#2a6a2a);border:1px solid #2ecc71;color:#2ecc71;padding:7px 16px;border-radius:8px;font-size:0.85rem;cursor:pointer;font-weight:bold;">
          📸＋🎯 再スナップ＆再生成
        </button>
        <span id="snap-history-label" style="font-size:0.75rem;color:#4a6a8a;align-self:center;"></span>
      </div>
      <div id="movement-body"></div>
    </div>

    <!-- 馬選択パネル -->
    <div id="horse-panel" style="display:none;background:#1a2535;border:1px solid #2a3d55;border-radius:12px;padding:20px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <span style="font-size:0.9rem;color:#ffd700;font-weight:bold;">除外する馬のチェックを外してください</span>
        <div style="display:flex;gap:8px;">
          <button onclick="checkAllHorses(true)" style="background:#1a3a2a;border:1px solid #2a5;color:#2ecc71;padding:4px 12px;border-radius:6px;font-size:0.75rem;cursor:pointer;">全選択</button>
          <button onclick="checkAllHorses(false)" style="background:#3a1a1a;border:1px solid #a52;color:#e74c3c;padding:4px 12px;border-radius:6px;font-size:0.75rem;cursor:pointer;">全解除</button>
        </div>
      </div>
      <div id="horse-list"></div>
    </div>

    <!-- 週判定結果 -->
    <div id="verdict-card" class="verdict-card">
      <div class="verdict-title" id="verdict-title"></div>
      <div class="verdict-detail" id="verdict-detail"></div>
      <div class="verdict-races" id="verdict-races"></div>
      <div class="skip-reasons" id="skip-reasons"></div>
    </div>

    <!-- ステータス -->
    <div id="status" class="status-bar"></div>

    <!-- 結果 -->
    <div id="result">
      <div class="zone-note" style="display:flex;justify-content:space-between;align-items:center;">
        <span><strong>✔ 低ゾーン 0 通り保証</strong> — 全組み合わせが人気の和 <strong>15〜22</strong></span>
        <button onclick="toggleView()" id="view-btn" style="background:#1a2535;border:1px solid #2a5298;color:#8ba3c0;padding:5px 14px;border-radius:6px;font-size:0.8rem;cursor:pointer;">コンパクト表示</button>
      </div>
      <div class="summary-bar" id="summary"></div>
      <div class="races-bar" id="races-bar"></div>

      <!-- コンパクト表示 -->
      <div id="compact" style="display:none;background:#1a2535;border:1px solid #2a3d55;border-radius:12px;padding:20px;margin-bottom:16px;">
        <div style="font-size:0.75rem;color:#8ba3c0;margin-bottom:12px;letter-spacing:.05em;">IPAT 入力まとめ</div>
        <div id="compact-body"></div>
      </div>

      <!-- 詳細表示 -->
      <div id="tickets"></div>
    </div>
  </div>

  <script>
    function setPreset(v) {
      document.getElementById('budget-input').value = v;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status-bar ' + type;
      el.style.display = 'block';
    }

    function getDateVal() {
      return document.getElementById('date-input').value.trim();
    }

    async function checkWeek() {
      const btn = document.getElementById('check-btn');
      btn.disabled = true;
      document.getElementById('verdict-card').style.display = 'none';
      setStatus('今週のレース情報を確認中…', 'loading');

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: getDateVal()}),
        });
        const data = await res.json();
        if (!res.ok) { setStatus('エラー: ' + (data.error || res.statusText), 'error'); return; }

        renderVerdict(data);
        setStatus(`✔ ${data.date_label} の週判定完了`, 'ok');
      } catch (e) {
        setStatus('通信エラー: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderVerdict(data) {
      const card = document.getElementById('verdict-card');
      const isBuy = data.verdict === 'BUY';
      card.className = 'verdict-card ' + (isBuy ? 'buy' : 'skip');

      document.getElementById('verdict-title').textContent =
        isBuy ? '✅ 今週は購入推奨' : '⛔ 今週はスキップ推奨';

      document.getElementById('verdict-detail').textContent =
        `${data.date_label} — 平均出走頭数 ${data.avg_field_size}頭 / 重・不良馬場 ${data.heavy_count}レース`;

      document.getElementById('verdict-races').innerHTML = data.races.map(r => {
        const isHeavy = r.track_condition === '重' || r.track_condition === '不良';
        return `<div class="verdict-race${isHeavy ? ' heavy' : ''}">
          <div class="rname">R${r.slot} ${r.name}</div>
          <div class="rinfo">${r.course_type||'?'}${r.distance||'?'}m / ${r.track_condition||'馬場不明'} / ${r.field_size||'?'}頭</div>
        </div>`;
      }).join('');

      const reasonsEl = document.getElementById('skip-reasons');
      if (data.skip_reasons.length > 0) {
        reasonsEl.innerHTML = data.skip_reasons.map(r =>
          `<div class="skip-reason">⚠ ${r}</div>`
        ).join('');
      } else {
        reasonsEl.innerHTML = '<div style="font-size:0.8rem;color:#2ecc71;margin-top:8px;">スキップ条件に該当なし → 購入してください</div>';
      }

      card.style.display = 'block';
    }

    async function quickGenerate() {
      const btn = document.getElementById('quick-btn');
      btn.disabled = true;
      const budget = parseInt(document.getElementById('budget-input').value);
      if (isNaN(budget) || budget < 1000) { alert('予算を入力してください'); btn.disabled=false; return; }
      const dateVal = getDateVal();

      // Step1: スナップショット保存
      btn.textContent = '📸 オッズ記録中…';
      try {
        await fetch('/api/snapshot', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({date: dateVal, label: '締切前'}),
        });
      } catch(e) { console.warn('snapshot失敗:', e); }

      // Step2: 変動取得して表示
      btn.textContent = '📊 変動確認中…';
      try {
        const mres = await fetch('/api/odds_movement', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({date: dateVal}),
        });
        const mdata = await mres.json();
        if (mres.ok) {
          renderMovement(mdata);
          document.getElementById('movement-panel').style.display = 'block';
          // スナップ履歴ラベルを更新
          const allLabels = [...new Set(mdata.slots.flatMap(s => s.horses.flatMap(h => (h.history||[]).map(p => p.at))))].slice(-6);
          document.getElementById('snap-history-label').textContent = allLabels.length ? `記録: ${allLabels.join(' → ')}` : '';
        }
      } catch(e) { console.warn('movement失敗:', e); }

      // Step3: 買い目生成
      btn.textContent = '🎯 買い目生成中…';
      document.getElementById('result').style.display = 'none';
      setStatus('データ取得中… しばらくお待ちください（10〜30秒）', 'loading');
      try {
        const res = await fetch('/api/generate', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({budget, date: dateVal, excluded: getExcluded(), auto_filter: document.getElementById('auto-filter').checked}),
        });
        const data = await res.json();
        if (!res.ok) { setStatus('エラー: '+(data.error||res.statusText),'error'); return; }
        setStatus(`✔ ${data.date_label} — ${data.total_tickets}チケット / ${data.total_combos}通り / ${data.total_cost.toLocaleString()}円`, 'ok');
        renderResult(data);
        // コンパクト表示を自動で開く
        if (!compactMode) toggleView();
        // ページ最下部へスクロール（買い目がすぐ見える）
        setTimeout(() => document.getElementById('compact').scrollIntoView({behavior:'smooth'}), 300);
      } catch(e) {
        setStatus('通信エラー: '+e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 締切前ワンボタン — 記録 → 急落確認 → 買い目生成';
      }
    }

    function _timeLabel() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    async function _doSnapshot(label) {
      const res = await fetch('/api/snapshot', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({date: getDateVal(), label}),
      });
      return res.json();
    }

    async function saveSnapshot() {
      const btn = document.getElementById('snap-btn');
      btn.disabled = true; btn.textContent = '記録中…';
      try {
        const label = _timeLabel();
        const data = await _doSnapshot(label);
        if (data.error) { alert('エラー: ' + data.error); return; }
        setStatus(`✅ ${label} のオッズを記録しました（${data.saved}頭）`, 'ok');
      } catch(e) { alert('通信エラー: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = '📸 オッズ記録'; }
    }

    async function reSnap() {
      const btn = document.getElementById('resnap-btn');
      btn.disabled = true; btn.textContent = '記録中…';
      try {
        const label = _timeLabel();
        const data = await _doSnapshot(label);
        if (data.error) { alert('エラー: ' + data.error); return; }
        // 変動表示を更新
        await loadMovement();
        setStatus(`✅ ${label} のオッズを記録しました（${data.saved}頭）`, 'ok');
      } catch(e) { alert('通信エラー: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = '📸 再スナップ'; }
    }

    async function reSnapAndGenerate() {
      const btn = document.getElementById('resnap-gen-btn');
      btn.disabled = true; btn.textContent = '処理中…';
      try {
        // 再スナップ
        const label = _timeLabel();
        await _doSnapshot(label);
        // 変動更新
        await loadMovement();
        // 買い目再生成
        await generate();
        if (!compactMode) toggleView();
        setTimeout(() => document.getElementById('compact').scrollIntoView({behavior:'smooth'}), 300);
      } catch(e) { alert('通信エラー: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = '📸＋🎯 再スナップ＆再生成'; }
    }

    async function loadMovement() {
      const btn = document.getElementById('move-btn');
      btn.disabled = true; btn.textContent = '取得中…';
      try {
        const res = await fetch('/api/odds_movement', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: getDateVal()}),
        });
        const data = await res.json();
        if (!res.ok) { alert('エラー: ' + data.error); return; }
        renderMovement(data);
        document.getElementById('movement-panel').style.display = 'block';
      } catch(e) { alert('通信エラー: ' + e.message); }
      finally { btn.disabled = false; btn.textContent = '📊 変動を見る'; }
    }

    function renderMovement(data) {
      document.getElementById('movement-body').innerHTML = data.slots.map(slot => {
        const horses = slot.horses.map(h => {
          if (!h.history || h.history.length < 2) {
            const cur = h.history && h.history[0];
            return `<div style="padding:5px 0;border-bottom:1px solid #1e2840;opacity:0.5;font-size:0.8rem;">
              ${h.horse_number}番 ${h.horse_name} — スナップショット1件のみ
            </div>`;
          }
          const first = h.history[0], last = h.history[h.history.length - 1];
          const chg = h.odds_change;
          const popChg = h.pop_change;
          const alertStyle = h.alert ? 'background:#3a0a0a;border-left:3px solid #e74c3c;' : '';
          const chgColor = chg === null ? '#6a88aa' : chg < 0 ? '#e74c3c' : '#2ecc71';
          const chgText = chg === null ? '—' : `${chg > 0 ? '+' : ''}${chg}%`;
          const popText = popChg === null ? '' : popChg > 0 ? `<span style="color:#e74c3c;font-size:0.75rem;">人気+${popChg}</span>` :
                          popChg < 0 ? `<span style="color:#2ecc71;font-size:0.75rem;">人気${popChg}</span>` : '';
          const histText = h.history.map(p => `<span style="color:#6a88aa;font-size:0.7rem;">${p.label}:${p.odds}倍(${p.popularity}人気)</span>`).join(' → ');
          return `<div style="padding:6px 8px;border-bottom:1px solid #1e2840;${alertStyle}display:flex;align-items:center;gap:10px;">
            ${h.alert ? '<span style="color:#e74c3c;font-size:1rem;">🔴</span>' : '<span style="font-size:1rem;">　</span>'}
            <span style="min-width:60px;font-size:0.85rem;color:${h.alert?'#ffd700':'#e8e8e8'};font-weight:${h.alert?'bold':'normal'};">${h.horse_number}番 ${h.horse_name}</span>
            <span style="min-width:50px;font-size:0.9rem;color:${chgColor};font-weight:bold;">${chgText}</span>
            ${popText}
            <span style="font-size:0.75rem;color:#6a88aa;">${histText}</span>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:16px;">
          <div style="font-size:0.8rem;color:#b88ae0;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #3a1a5a;">
            R${slot.slot_number} ${slot.name}
          </div>
          ${horses || '<div style="color:#4a6a8a;font-size:0.8rem;">スナップショットなし</div>'}
        </div>`;
      }).join('');
    }

    async function loadHorses() {
      const btn = document.getElementById('select-btn');
      btn.disabled = true;
      btn.textContent = '取得中…';
      try {
        const res = await fetch('/api/horses', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: getDateVal()}),
        });
        const data = await res.json();
        if (!res.ok) { alert('エラー: ' + (data.error || res.statusText)); return; }
        renderHorsePanel(data);
        document.getElementById('horse-panel').style.display = 'block';
      } catch (e) {
        alert('通信エラー: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '② 馬を選択';
      }
    }

    function renderHorsePanel(data) {
      document.getElementById('horse-list').innerHTML = data.slots.map(slot => `
        <div style="margin-bottom:16px;">
          <div style="font-size:0.8rem;color:#8ba3c0;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #1e3050;">
            R${slot.slot_number} ${slot.name}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${slot.horses.map(h => `
              <label style="display:flex;align-items:center;gap:5px;cursor:pointer;background:#0f1923;border:1px solid #2a3d55;border-radius:6px;padding:5px 10px;min-width:90px;">
                <input type="checkbox" class="horse-cb" data-slot="${slot.slot_number}" data-num="${h.horse_number}" checked
                  style="width:14px;height:14px;cursor:pointer;" onchange="updateLabel(this)">
                <span class="horse-label" style="font-size:0.85rem;">
                  <span style="color:#ffd700;font-weight:bold;">${h.horse_number}番</span>
                  <span style="color:#6a88aa;font-size:0.75rem;">${h.popularity}人気</span>
                  <span style="color:#e8e8e8;font-size:0.8rem;">${h.horse_name}</span>
                </span>
              </label>`).join('')}
          </div>
        </div>`).join('');
    }

    function updateLabel(cb) {
      const label = cb.closest('label');
      label.style.opacity = cb.checked ? '1' : '0.35';
      label.style.borderColor = cb.checked ? '#2a3d55' : '#5a2a2a';
    }

    function checkAllHorses(checked) {
      document.querySelectorAll('.horse-cb').forEach(cb => {
        cb.checked = checked;
        updateLabel(cb);
      });
    }

    function getExcluded() {
      const excluded = {};
      document.querySelectorAll('.horse-cb:not(:checked)').forEach(cb => {
        const slot = cb.dataset.slot;
        if (!excluded[slot]) excluded[slot] = [];
        excluded[slot].push(parseInt(cb.dataset.num));
      });
      return excluded;
    }

    async function generate() {
      const btn = document.getElementById('gen-btn');
      const budget = parseInt(document.getElementById('budget-input').value);
      if (isNaN(budget) || budget < 1000) {
        setStatus('予算は1,000円以上を入力してください', 'error');
        return;
      }
      btn.disabled = true;
      document.getElementById('result').style.display = 'none';
      setStatus('データ取得中… しばらくお待ちください（10〜30秒）', 'loading');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({budget, date: getDateVal(), excluded: getExcluded(), auto_filter: document.getElementById('auto-filter').checked}),
        });
        const data = await res.json();
        if (!res.ok) { setStatus('エラー: ' + (data.error || res.statusText), 'error'); return; }
        setStatus(`✔ ${data.date_label} の買い目を生成しました — ${data.total_tickets}チケット / ${data.total_combos}通り / ${data.total_cost.toLocaleString()}円`, 'ok');
        renderResult(data);
      } catch (e) {
        setStatus('通信エラー: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(data) {
      document.getElementById('summary').innerHTML = `
        <div class="summary-item"><div class="label">開催日</div><div class="value">${data.date_label}</div></div>
        <div class="summary-item"><div class="label">チケット数</div><div class="value">${data.total_tickets}</div></div>
        <div class="summary-item"><div class="label">総通り数</div><div class="value">${data.total_combos.toLocaleString()}</div></div>
        <div class="summary-item"><div class="label">合計金額</div><div class="value">${data.total_cost.toLocaleString()}円</div></div>
      `;
      document.getElementById('races-bar').innerHTML = data.races.map(r =>
        `<div class="race-chip"><span>R${r.slot}</span>${r.name}</div>`
      ).join('');
      document.getElementById('tickets').innerHTML = data.tickets.map(t => `
        <div class="ticket">
          <div class="ticket-header">
            <div class="ticket-no">チケット ${t.ticket_no}</div>
            <div class="ticket-info">
              <span class="range-badge">和 ${t.sum_lo}〜${t.sum_hi}</span>
              <span class="combos">${t.combos}通り / ${t.cost.toLocaleString()}円</span>
            </div>
          </div>
          <div class="ticket-body">
            <table class="slot-table">
              <thead><tr><th>スロット</th><th>レース</th><th>人気帯</th><th>出走馬</th></tr></thead>
              <tbody>
                ${t.slots.map(s => `
                  <tr>
                    <td class="slot-num">R${s.slot}</td>
                    <td class="race-name">${s.race_name}</td>
                    <td class="pop-range">${s.popularity_range}</td>
                    <td>
                      <div style="font-size:1rem;font-weight:bold;color:#ffd700;letter-spacing:.05em;">
                        ${s.numbers.join(' ・ ')}番
                      </div>
                      <div style="font-size:0.75rem;color:#6a88aa;margin-top:3px;">
                        ${[...s.horses].sort((a,b)=>a.number-b.number).map(h=>`${h.number}番=${h.popularity}人気`).join('　')}
                      </div>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <div class="ipat-row">
              <div class="ipat-label">IPAT 入力（馬番）</div>
              <div class="ipat-grid">
                ${t.slots.map(s => `
                  <div class="ipat-slot"><span>R${s.slot}</span>${s.numbers.join('・')}番</div>`).join('')}
              </div>
            </div>
          </div>
        </div>`).join('');
      // コンパクト表示を生成
      // ① レース別 全チケット共通の応援馬番（ユニオン）
      const raceUnion = data.races.map((r, ri) => {
        const allNums = new Set();
        data.tickets.forEach(t => t.slots[ri].numbers.forEach(n => allNums.add(n)));
        const sorted = [...allNums].sort((a,b)=>a-b);
        return `<div style="display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid #1e3050;">
          <span style="min-width:130px;font-size:0.75rem;color:#8ba3c0;flex-shrink:0;">R${r.slot} ${r.name}</span>
          <span style="font-size:1.1rem;font-weight:bold;color:#ffd700;letter-spacing:.05em;">${sorted.join('・')}番</span>
        </div>`;
      }).join('');

      // ① レース別 全チケット応援馬番（大きく表示）
      const raceUnionRows = data.races.map((r, ri) => {
        const allNums = new Set();
        data.tickets.forEach(t => t.slots[ri].numbers.forEach(n => allNums.add(n)));
        const sorted = [...allNums].sort((a,b)=>a-b);
        return `<div class="ipat-race-row">
          <span class="ipat-race-label">R${r.slot}</span>
          <span class="ipat-race-nums">${sorted.join('・')}番</span>
        </div>`;
      }).join('');

      // ② チケット別一覧
      const ticketRows = data.tickets.map(t => {
        const slots = t.slots.map(s => `<span class="ipat-ticket-slot"><span class="ipat-ticket-slot-r">R${s.slot}▶</span>${s.numbers.join('・')}番</span>`).join('');
        return `<div class="ipat-ticket-row">
          <span class="ipat-ticket-label">T${t.ticket_no}</span>
          ${slots}
          <span class="ipat-ticket-combos">${t.combos}通り</span>
        </div>`;
      }).join('');

      document.getElementById('compact-body').innerHTML =
        `<div style="margin-bottom:16px;">
           <div style="font-size:0.7rem;color:#4a6a8a;margin-bottom:6px;letter-spacing:.05em;">▼ レース別 応援馬番（全チケット共通）</div>
           ${raceUnionRows}
         </div>
         <div>
           <div style="font-size:0.7rem;color:#4a6a8a;margin-bottom:6px;margin-top:14px;letter-spacing:.05em;">▼ チケット別 買い目</div>
           ${ticketRows}
         </div>`;

      document.getElementById('result').style.display = 'block';
    }

    let compactMode = false;
    function toggleView() {
      compactMode = !compactMode;
      document.getElementById('compact').style.display  = compactMode ? 'block' : 'none';
      document.getElementById('tickets').style.display  = compactMode ? 'none'  : 'block';
      document.getElementById('view-btn').textContent   = compactMode ? '詳細表示' : 'コンパクト表示';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') checkWeek(); });
  </script>
</body>
</html>
