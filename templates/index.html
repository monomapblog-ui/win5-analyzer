<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIN5 買い目生成</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: #0f1923;
      color: #e8e8e8;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a2a4a, #0d3b6e);
      padding: 20px 24px;
      border-bottom: 2px solid #2a5298;
    }
    header h1 { font-size: 1.6rem; color: #ffd700; letter-spacing: 0.05em; }
    header p { font-size: 0.85rem; color: #8ba3c0; margin-top: 4px; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

    /* ─── フォーム ─── */
    .form-card {
      background: #1a2535;
      border: 1px solid #2a3d55;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .form-card h2 { font-size: 1rem; color: #8ba3c0; margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: #8ba3c0; }
    .form-group input {
      background: #0f1923;
      border: 1px solid #2a3d55;
      border-radius: 8px;
      color: #e8e8e8;
      padding: 10px 14px;
      font-size: 1rem;
      width: 180px;
    }
    .form-group input:focus { outline: none; border-color: #ffd700; }
    .btn {
      border: none; border-radius: 8px; padding: 11px 24px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-check { background: #2a5298; color: #fff; }
    .btn-generate { background: linear-gradient(135deg, #f0a500, #ffd700); color: #0f1923; }

    .budget-presets { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .preset-btn {
      background: #1a2535; border: 1px solid #2a5298; border-radius: 6px;
      color: #8ba3c0; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
    }
    .preset-btn:hover, .preset-btn.active { background: #2a3d55; border-color: #ffd700; color: #ffd700; }

    /* ─── ステータス ─── */
    .status-bar {
      border-radius: 8px; padding: 12px 18px; margin-bottom: 16px;
      font-size: 0.9rem; display: none;
    }
    .status-bar.loading { background:#1a2535; border:1px solid #2a5298; color:#8ba3c0; }
    .status-bar.error   { background:#1a0a0a; border:1px solid #c0392b; color:#e74c3c; }
    .status-bar.ok      { background:#0a1a0a; border:1px solid #27ae60; color:#2ecc71; }

    /* ─── 週判定バナー ─── */
    .verdict-card {
      border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; display: none;
    }
    .verdict-card.buy  { background:#0a2a0a; border:2px solid #27ae60; }
    .verdict-card.skip { background:#2a0a0a; border:2px solid #c0392b; }
    .verdict-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; }
    .verdict-card.buy  .verdict-title { color: #2ecc71; }
    .verdict-card.skip .verdict-title { color: #e74c3c; }
    .verdict-detail { font-size: 0.85rem; color: #a0b0c0; margin-bottom: 12px; }
    .verdict-races { display: flex; gap: 8px; flex-wrap: wrap; }
    .verdict-race {
      background: #0f1923; border: 1px solid #2a3d55; border-radius: 6px;
      padding: 6px 12px; font-size: 0.8rem;
    }
    .verdict-race .rname { color: #c0d0e0; }
    .verdict-race .rinfo { color: #8ba3c0; font-size: 0.75rem; margin-top: 2px; }
    .verdict-race.heavy { border-color: #c0392b; }
    .skip-reasons { margin-top: 10px; }
    .skip-reason {
      background: #3a0a0a; border-left: 3px solid #e74c3c;
      padding: 6px 12px; font-size: 0.8rem; color: #e74c3c; margin-top: 6px; border-radius: 0 4px 4px 0;
    }

    /* ─── サマリー ─── */
    .summary-bar {
      background: linear-gradient(135deg, #0d3b6e, #1a2a4a);
      border: 1px solid #2a5298; border-radius: 10px;
      padding: 16px 20px; margin-bottom: 20px;
      display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
    }
    .summary-item { display: flex; flex-direction: column; gap: 2px; }
    .summary-item .label { font-size: 0.75rem; color: #8ba3c0; }
    .summary-item .value { font-size: 1.3rem; font-weight: bold; color: #ffd700; }

    /* ─── チケット ─── */
    .ticket { background:#1a2535; border:1px solid #2a3d55; border-radius:12px; margin-bottom:16px; overflow:hidden; }
    .ticket-header {
      background: #0d3b6e; padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .ticket-header .ticket-no { font-size: 0.85rem; color: #8ba3c0; }
    .ticket-header .ticket-info { display: flex; gap: 20px; align-items: center; }
    .ticket-header .combos { color: #ffd700; font-weight: bold; }
    .range-badge {
      background:#1a4a1a; border:1px solid #27ae60; border-radius:4px;
      padding:2px 8px; font-size:0.75rem; color:#2ecc71;
    }

    table.slot-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    table.slot-table th {
      background:#141e2e; color:#8ba3c0; padding:8px 12px; text-align:left;
      font-weight:normal; font-size:0.75rem; border-bottom:1px solid #2a3d55;
    }
    table.slot-table td { padding:10px 12px; border-bottom:1px solid #1e2d42; vertical-align:middle; }
    table.slot-table tr:last-child td { border-bottom:none; }
    .slot-num { color:#8ba3c0; font-size:0.8rem; }
    .race-name { color:#c0d0e0; }
    .pop-range { color:#8ba3c0; font-size:0.8rem; }

    .horse-list { display:flex; gap:8px; flex-wrap:wrap; }
    .horse-chip {
      display:flex; align-items:center; gap:4px;
      background:#0f1923; border:1px solid #2a3d55; border-radius:5px; padding:3px 8px; font-size:0.8rem;
    }
    .horse-chip .num {
      background:#2a5298; color:#fff; border-radius:3px; padding:0 5px;
      font-weight:bold; font-size:0.75rem; min-width:22px; text-align:center;
    }
    .horse-chip .pop { color:#f0a500; font-size:0.7rem; }

    .ipat-row { background:#0f1923; border-top:1px solid #2a3d55; padding:12px 18px; }
    .ipat-row .ipat-label { font-size:0.75rem; color:#8ba3c0; margin-bottom:6px; }
    .ipat-grid { display:flex; gap:8px; flex-wrap:wrap; }
    .ipat-slot {
      background:#1a2535; border:1px solid #2a5298; border-radius:6px;
      padding:6px 12px; font-size:0.85rem; font-family:monospace; color:#e8e8e8;
    }
    .ipat-slot span { color:#8ba3c0; font-size:0.75rem; margin-right:4px; }

    .zone-note {
      background:#0f2a1a; border:1px solid #27ae60; border-radius:8px;
      padding:10px 16px; font-size:0.8rem; color:#2ecc71; margin-bottom:20px;
    }
    .zone-note strong { color:#ffd700; }

    #result { display:none; }
    .races-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .race-chip {
      background:#1a2535; border:1px solid #2a3d55; border-radius:6px;
      padding:6px 12px; font-size:0.8rem; color:#8ba3c0;
    }
    .race-chip span { color:#ffd700; font-weight:bold; margin-right:4px; }
  </style>
</head>
<body>
  <header>
    <h1>🏇 WIN5 買い目生成</h1>
    <p>ターゲットゾーン（人気の和 15〜22）を広範囲カバー / 低ゾーン 0 通り保証</p>
  </header>

  <div class="container">
    <!-- 入力フォーム -->
    <div class="form-card">
      <h2>購入条件を設定</h2>
      <div class="form-row">
        <div class="form-group">
          <label>日付（空欄で最新WIN5）</label>
          <input type="text" id="date-input" placeholder="例: 20260614" maxlength="8">
        </div>
        <div class="form-group">
          <label>予算</label>
          <input type="number" id="budget-input" value="50000" step="1000" min="1000">
        </div>
        <button class="btn btn-check" id="check-btn" onclick="checkWeek()">① 今週の判定</button>
        <button class="btn btn-generate" id="gen-btn" onclick="generate()">② 買い目を生成</button>
      </div>
      <div class="budget-presets">
        <span style="font-size:0.75rem;color:#8ba3c0;align-self:center;">予算:</span>
        <button class="preset-btn" onclick="setPreset(30000)">3万円</button>
        <button class="preset-btn active" onclick="setPreset(50000)">5万円</button>
        <button class="preset-btn" onclick="setPreset(80000)">8万円</button>
        <button class="preset-btn" onclick="setPreset(100000)">10万円</button>
      </div>
    </div>

    <!-- 週判定結果 -->
    <div id="verdict-card" class="verdict-card">
      <div class="verdict-title" id="verdict-title"></div>
      <div class="verdict-detail" id="verdict-detail"></div>
      <div class="verdict-races" id="verdict-races"></div>
      <div class="skip-reasons" id="skip-reasons"></div>
    </div>

    <!-- ステータス -->
    <div id="status" class="status-bar"></div>

    <!-- 結果 -->
    <div id="result">
      <div class="zone-note" style="display:flex;justify-content:space-between;align-items:center;">
        <span><strong>✔ 低ゾーン 0 通り保証</strong> — 全組み合わせが人気の和 <strong>15〜22</strong></span>
        <button onclick="toggleView()" id="view-btn" style="background:#1a2535;border:1px solid #2a5298;color:#8ba3c0;padding:5px 14px;border-radius:6px;font-size:0.8rem;cursor:pointer;">コンパクト表示</button>
      </div>
      <div class="summary-bar" id="summary"></div>
      <div class="races-bar" id="races-bar"></div>

      <!-- コンパクト表示 -->
      <div id="compact" style="display:none;background:#1a2535;border:1px solid #2a3d55;border-radius:12px;padding:20px;margin-bottom:16px;">
        <div style="font-size:0.75rem;color:#8ba3c0;margin-bottom:12px;letter-spacing:.05em;">IPAT 入力まとめ</div>
        <div id="compact-body"></div>
      </div>

      <!-- 詳細表示 -->
      <div id="tickets"></div>
    </div>
  </div>

  <script>
    function setPreset(v) {
      document.getElementById('budget-input').value = v;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status-bar ' + type;
      el.style.display = 'block';
    }

    function getDateVal() {
      return document.getElementById('date-input').value.trim();
    }

    async function checkWeek() {
      const btn = document.getElementById('check-btn');
      btn.disabled = true;
      document.getElementById('verdict-card').style.display = 'none';
      setStatus('今週のレース情報を確認中…', 'loading');

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: getDateVal()}),
        });
        const data = await res.json();
        if (!res.ok) { setStatus('エラー: ' + (data.error || res.statusText), 'error'); return; }

        renderVerdict(data);
        setStatus(`✔ ${data.date_label} の週判定完了`, 'ok');
      } catch (e) {
        setStatus('通信エラー: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderVerdict(data) {
      const card = document.getElementById('verdict-card');
      const isBuy = data.verdict === 'BUY';
      card.className = 'verdict-card ' + (isBuy ? 'buy' : 'skip');

      document.getElementById('verdict-title').textContent =
        isBuy ? '✅ 今週は購入推奨' : '⛔ 今週はスキップ推奨';

      document.getElementById('verdict-detail').textContent =
        `${data.date_label} — 平均出走頭数 ${data.avg_field_size}頭 / 重・不良馬場 ${data.heavy_count}レース`;

      document.getElementById('verdict-races').innerHTML = data.races.map(r => {
        const isHeavy = r.track_condition === '重' || r.track_condition === '不良';
        return `<div class="verdict-race${isHeavy ? ' heavy' : ''}">
          <div class="rname">R${r.slot} ${r.name}</div>
          <div class="rinfo">${r.course_type||'?'}${r.distance||'?'}m / ${r.track_condition||'馬場不明'} / ${r.field_size||'?'}頭</div>
        </div>`;
      }).join('');

      const reasonsEl = document.getElementById('skip-reasons');
      if (data.skip_reasons.length > 0) {
        reasonsEl.innerHTML = data.skip_reasons.map(r =>
          `<div class="skip-reason">⚠ ${r}</div>`
        ).join('');
      } else {
        reasonsEl.innerHTML = '<div style="font-size:0.8rem;color:#2ecc71;margin-top:8px;">スキップ条件に該当なし → 購入してください</div>';
      }

      card.style.display = 'block';
    }

    async function generate() {
      const btn = document.getElementById('gen-btn');
      const budget = parseInt(document.getElementById('budget-input').value);
      if (isNaN(budget) || budget < 1000) {
        setStatus('予算は1,000円以上を入力してください', 'error');
        return;
      }
      btn.disabled = true;
      document.getElementById('result').style.display = 'none';
      setStatus('データ取得中… しばらくお待ちください（10〜30秒）', 'loading');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({budget, date: getDateVal()}),
        });
        const data = await res.json();
        if (!res.ok) { setStatus('エラー: ' + (data.error || res.statusText), 'error'); return; }
        setStatus(`✔ ${data.date_label} の買い目を生成しました — ${data.total_tickets}チケット / ${data.total_combos}通り / ${data.total_cost.toLocaleString()}円`, 'ok');
        renderResult(data);
      } catch (e) {
        setStatus('通信エラー: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(data) {
      document.getElementById('summary').innerHTML = `
        <div class="summary-item"><div class="label">開催日</div><div class="value">${data.date_label}</div></div>
        <div class="summary-item"><div class="label">チケット数</div><div class="value">${data.total_tickets}</div></div>
        <div class="summary-item"><div class="label">総通り数</div><div class="value">${data.total_combos.toLocaleString()}</div></div>
        <div class="summary-item"><div class="label">合計金額</div><div class="value">${data.total_cost.toLocaleString()}円</div></div>
      `;
      document.getElementById('races-bar').innerHTML = data.races.map(r =>
        `<div class="race-chip"><span>R${r.slot}</span>${r.name}</div>`
      ).join('');
      document.getElementById('tickets').innerHTML = data.tickets.map(t => `
        <div class="ticket">
          <div class="ticket-header">
            <div class="ticket-no">チケット ${t.ticket_no}</div>
            <div class="ticket-info">
              <span class="range-badge">和 ${t.sum_lo}〜${t.sum_hi}</span>
              <span class="combos">${t.combos}通り / ${t.cost.toLocaleString()}円</span>
            </div>
          </div>
          <div class="ticket-body">
            <table class="slot-table">
              <thead><tr><th>スロット</th><th>レース</th><th>人気帯</th><th>出走馬</th></tr></thead>
              <tbody>
                ${t.slots.map(s => `
                  <tr>
                    <td class="slot-num">R${s.slot}</td>
                    <td class="race-name">${s.race_name}</td>
                    <td class="pop-range">${s.popularity_range}</td>
                    <td>
                      <div style="font-size:1rem;font-weight:bold;color:#ffd700;letter-spacing:.05em;">
                        ${s.numbers.join(' ・ ')}番
                      </div>
                      <div style="font-size:0.75rem;color:#6a88aa;margin-top:3px;">
                        ${[...s.horses].sort((a,b)=>a.number-b.number).map(h=>`${h.number}番=${h.popularity}人気`).join('　')}
                      </div>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <div class="ipat-row">
              <div class="ipat-label">IPAT 入力（馬番）</div>
              <div class="ipat-grid">
                ${t.slots.map(s => `
                  <div class="ipat-slot"><span>R${s.slot}</span>${s.numbers.join('・')}番</div>`).join('')}
              </div>
            </div>
          </div>
        </div>`).join('');
      // コンパクト表示を生成
      // ① レース別 全チケット共通の応援馬番（ユニオン）
      const raceUnion = data.races.map((r, ri) => {
        const allNums = new Set();
        data.tickets.forEach(t => t.slots[ri].numbers.forEach(n => allNums.add(n)));
        const sorted = [...allNums].sort((a,b)=>a-b);
        return `<div style="display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid #1e3050;">
          <span style="min-width:130px;font-size:0.75rem;color:#8ba3c0;flex-shrink:0;">R${r.slot} ${r.name}</span>
          <span style="font-size:1.1rem;font-weight:bold;color:#ffd700;letter-spacing:.05em;">${sorted.join('・')}番</span>
        </div>`;
      }).join('');

      // ② チケット別一覧（横並び簡易）
      const ticketRows = data.tickets.map(t => {
        const slots = t.slots.map(s => `<span style="margin-right:12px;white-space:nowrap;"><span style="color:#6a88aa;font-size:0.7rem;">R${s.slot}▶</span><span style="color:#e8e8e8;font-size:0.85rem;">${s.numbers.join('・')}番</span></span>`).join('');
        return `<div style="padding:7px 0;border-bottom:1px solid #1a2a3a;display:flex;flex-wrap:wrap;align-items:center;gap:4px;">
          <span style="color:#ffd700;font-weight:bold;font-size:0.85rem;min-width:28px;">T${t.ticket_no}</span>
          ${slots}
          <span style="color:#4a6a8a;font-size:0.75rem;margin-left:auto;">${t.combos}通り</span>
        </div>`;
      }).join('');

      document.getElementById('compact-body').innerHTML =
        `<div style="margin-bottom:16px;">
           <div style="font-size:0.7rem;color:#4a6a8a;margin-bottom:6px;letter-spacing:.05em;">▼ レース別 応援馬番（全チケット共通）</div>
           ${raceUnion}
         </div>
         <div>
           <div style="font-size:0.7rem;color:#4a6a8a;margin-bottom:6px;letter-spacing:.05em;">▼ チケット別 買い目</div>
           ${ticketRows}
         </div>`;

      document.getElementById('result').style.display = 'block';
    }

    let compactMode = false;
    function toggleView() {
      compactMode = !compactMode;
      document.getElementById('compact').style.display  = compactMode ? 'block' : 'none';
      document.getElementById('tickets').style.display  = compactMode ? 'none'  : 'block';
      document.getElementById('view-btn').textContent   = compactMode ? '詳細表示' : 'コンパクト表示';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') checkWeek(); });
  </script>
</body>
</html>
